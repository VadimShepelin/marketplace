apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-deploy
  labels:
    app: rate
spec:
  selector:
    matchLabels:
      app: rate
  template:
    metadata:
      labels:
        app: rate
    spec:
      containers:
        - name: rate
          image: kocichca152/rate:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rate-service
  labels:
    app: rate-service
spec:
  selector:
    app: rate
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
